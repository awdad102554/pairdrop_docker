# TURN 服务器标识
realm=pairdrop.local
server-name=pairdrop-fnOS

# 监听所有接口（自动适配 192.168.123.16 和 10.99.144.29）
listening-ip=0.0.0.0
external-ip=192.168.123.16/10.99.144.29

# 端口配置
listening-port=3478
tls-listening-port=5349
min-port=10000
max-port=20000

# 认证（务必修改密码）
user=pairdrop:pairdrop

# 安全与功能
fingerprint
lt-cred-mech
no-sslv3
no-tlsv1
no-tlsv1_1

# 日志（调试时开启 verbose）
log-file=-
# verbose

# SSL 证书路径（容器内路径）
cert=/etc/coturn/ssl/hailiangjeff.top.key
pkey=/etc/coturn/ssl/hailiangjeff.top.pem
# dh-file=/etc/coturn/ssl/dhparam.pem  # 如没有可注释掉

# 安全加固
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
no-cli
no-multicast-peers
no-software-attribute
check-origin-consistency
