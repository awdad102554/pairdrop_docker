version: "3"
services:
  pairdrop:
    image: "lscr.io/linuxserver/pairdrop:latest"
    container_name: pairdrop
    restart: unless-stopped
    volumes:
      - ./rtc_config.json:/home/node/app/rtc_config.json:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      # 关键：必须开启，跨网段 P2P 失败时走 WebSocket 中继
      - WS_FALLBACK=true
      # 可选：尝试所有可用 IP 连接
      - WS_FALLBACK_ALL_IPS=true  
      - RATE_LIMIT=false
      - RTC_CONFIG=/home/node/app/rtc_config.json
      - DEBUG_MODE=false  # 联调失败时改为 true 看日志
    ports:
      # 关键：改为 0.0.0.0 监听两个网卡，端口 3210
      - "0.0.0.0:3210:3000"
    # 如果不需要端口映射层，也可用 host 模式（性能稍好）：
    # network_mode: host

  coturn_server:
    image: "coturn/coturn:latest"
    container_name: coturn
    restart: unless-stopped
    # 关键：host 模式让 Coturn 监听 192.168.123.16 和 10.99.144.29
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./ssl/:/etc/coturn/ssl/:ro
    # host 模式下端口映射无效，但保留可防止误解
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "10000-20000:10000-20000/udp"